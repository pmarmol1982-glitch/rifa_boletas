<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rifa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 10px; }
        .contenedor { position: relative; display: inline-block; max-width: 100%; margin-top: 20px; }
        #imagenRifa { max-width: 100%; height: auto; display: block; border-radius: 10px; }
        
        .marcador {
            position: absolute; 
            /* Tamaño del check ajustado para que no se salga */
            width: 6.5%; height: 3.8%; 
            background: rgba(40, 167, 69, 0.9); border-radius: 50%;
            color: white; font-size: 14px; font-weight: bold;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; transform: translate(-50%, -50%);
            border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .marcador.activo { display: flex; }
        button {
            margin-top: 20px; padding: 15px 30px; font-size: 18px; 
            background: #25D366; color: white; border: none; 
            border-radius: 10px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { background: #1da851; }
    </style>
</head>
<body>

    <h2>Toca un número para marcarlo como VENDIDO</h2>
    
    <div class="contenedor" id="contenedorRifa">
        <img src="rifa.jpg" id="imagenRifa" alt="Rifa">
    </div>

    <br>
    <button onclick="descargarImagen()">📸 Descargar Imagen</button>

    <script>
        const contenedor = document.getElementById('contenedorRifa');
        let estado = JSON.parse(localStorage.getItem('estadoRifa')) || {};

        // Coordenadas exactas (X, Y) para cada fila basadas en tu imagen
        // X es la posición de la columna 0, 1, 2... 9
        const posX = [11.5, 20.2, 28.9, 37.6, 46.3, 55.0, 63.7, 72.4, 81.1, 89.8];
        
        // Y es la posición de cada fila (0-9, 10-19, etc.)
        const posY = [
            62.2, // Fila 0-9 (Un poquito más abajo para no chocar con el texto)
            66.7, // Fila 10-19
            71.2, // Fila 20-29
            75.7, // Fila 30-39
            80.2, // Fila 40-49
            84.7, // Fila 50-59
            89.2, // Fila 60-69
            93.7, // Fila 70-79
            98.2, // Fila 80-89 (Se ajustó porque la imagen se estiraba)
            102.7 // Fila 90-99 (Ajuste extremo para la última línea)
        ];

        // Generar los 100 marcadores
        for (let f = 0; f < 10; f++) {
            for (let c = 0; c < 10; c++) {
                const num = (f * 10) + c;
                const marcador = document.createElement('div');
                marcador.className = 'marcador';
                marcador.id = 'num-' + num;
                marcador.innerText = '✔';
                
                marcador.style.left = posX[c] + '%';
                marcador.style.top = posY[f] + '%';
                
                if (estado[num]) { marcador.classList.add('activo'); }
                contenedor.appendChild(marcador);
            }
        }

        contenedor.addEventListener('click', function(e) {
            const rect = contenedor.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            // Buscar el número más cercano al toque
            let numCercano = null;
            let distanciaMinima = 5; // Rango de tolerancia al tocar

            for (let f = 0; f < 10; f++) {
                for (let c = 0; c < 10; c++) {
                    const nx = posX[c];
                    const ny = posY[f];
                    // Calcular distancia entre el toque y el centro del número
                    const dist = Math.sqrt(Math.pow(x - nx, 2) + Math.pow(y - ny, 2));
                    
                    if (dist < distanciaMinima) {
                        distanciaMinima = dist;
                        numCercano = (f * 10) + c;
                    }
                }
            }

            if (numCercano !== null) {
                const marcador = document.getElementById('num-' + numCercano);
                marcador.classList.toggle('activo');
                estado[numCercano] = marcador.classList.contains('activo');
                localStorage.setItem('estadoRifa', JSON.stringify(estado));
            }
        });

        function descargarImagen() {
            const btn = document.querySelector('button');
            btn.innerText = "Generando imagen...";
            html2canvas(contenedor, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Rifa_Actualizada.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerText = "📸 Descargar Imagen";
            });
        }
    </script>
</body>
</html>
